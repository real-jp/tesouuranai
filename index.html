<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>PALM GOLD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 20px 40px;
      background: #0b0b0b;
      color: #f5e8c8;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    .logo {
      color: #d8b56a;
      letter-spacing: 5px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 25px;
    }
    h1 {
      margin-top: 55px;
      font-family: Georgia, serif;
      font-size: clamp(35px, 8vw, 52px);
      color: #e2c27b;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 1px solid #d8b56a;
      border-radius: 10px;
      background: linear-gradient(135deg, #f0d99a, #bd9143);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .card {
      margin-top: 35px;
      padding: 22px;
      border: 1px solid #594725;
      border-radius: 18px;
      background: #151515;
    }
    .camera-frame {
      display: none;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }
    #video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }
    #preview {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
    }
    input, textarea {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      background: #090909;
      border: 1px solid #594725;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }
    textarea {
      resize: none;
      overflow-y: auto;
    }
    label {
      display: block;
      text-align: left;
      margin-top: 20px;
      color: #d8b56a;
      font-size: 13px;
    }
    .character-count {
      margin-top: 6px;
      color: #a99a7d;
      font-size: 12px;
      text-align: right;
    }
    #status {
      margin-top: 15px;
      color: #d8b56a;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    footer {
      margin-top: 45px;
      padding: 15px 0 10px;
      color: #756b58;
      font-size: 11px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">PALM GOLD</div>
    <h1>Your Hands.<br>Your Story.</h1>
    <section class="card">
      <h2>手相占いする</h2>
      <button id="start" type="button">📸 カメラ起動</button>
      <div class="camera-frame" id="cameraFrame">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas" hidden></canvas>
      <img id="preview" alt="撮影した手の写真">
      <button id="take" type="button" hidden>写真を撮る</button>
      <button id="retake" type="button" hidden>撮り直す</button>
      <label for="nickname">ニックネーム（10字以内）</label>
      <input
        id="nickname"
        type="text"
        maxlength="10"
        autocomplete="off"
        placeholder="ニックネームを入力"
      >
      <div class="character-count" id="nicknameCount">0 / 10</div>
      <label for="question">相談内容（100字以内）</label>
      <textarea
        id="question"
        rows="3"
        maxlength="100"
        placeholder="相談内容を入力"
      ></textarea>
      <div class="character-count" id="questionCount">0 / 100</div>
      <button id="send" type="button" disabled>送信</button>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
    <footer>PALM GOLD · YOUR STORY</footer>
  </main>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const cameraFrame = document.getElementById("cameraFrame");
    const start = document.getElementById("start");
    const take = document.getElementById("take");
    const retake = document.getElementById("retake");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const nickname = document.getElementById("nickname");
    const question = document.getElementById("question");
    const nicknameCount = document.getElementById("nicknameCount");
    const questionCount = document.getElementById("questionCount");
    let stream = null;
    let photo = null;
    let previewUrl = null;
    let cameraStarting = false;
    function limitCharacters(input, maxLength, counter) {
      const chars = Array.from(input.value);
      if (chars.length > maxLength) {
        const limitedValue = chars.slice(0, maxLength).join("");
        input.value = limitedValue;
      }
      counter.textContent =
        `${Array.from(input.value).length} / ${maxLength}`;
    }
    function handleNicknameInput() {
      limitCharacters(nickname, 10, nicknameCount);
    }
    function handleQuestionInput() {
      limitCharacters(question, 100, questionCount);
    }
    nickname.addEventListener("input", handleNicknameInput);
    question.addEventListener("input", handleQuestionInput);
    nickname.addEventListener("compositionend", handleNicknameInput);
    question.addEventListener("compositionend", handleQuestionInput);
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
    }
    function clearPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      preview.removeAttribute("src");
      preview.style.display = "none";
    }
    // カメラを1つだけ起動する
    start.addEventListener("click", async () => {
      // 起動中・起動済み・撮影済みなら何もしない
      if (stream || cameraStarting || photo) return;
      status.textContent = "";
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        status.textContent =
          "カメラを利用できません。HTTPSのサイトで開いてください。";
        return;
      }
      cameraStarting = true;
      start.disabled = true;
      let newStream = null;
      try {
        newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        // 起動処理中に撮影済みになった場合は新しいカメラを閉じる
        if (photo) {
          newStream.getTracks().forEach(track => track.stop());
          return;
        }
        stream = newStream;
        video.srcObject = stream;
        cameraFrame.style.display = "block";
        await video.play();
        take.hidden = false;
      } catch (error) {
        if (newStream) {
          newStream.getTracks().forEach(track => track.stop());
        }
        stopCamera();
        cameraFrame.style.display = "none";
        status.textContent =
          error.name === "NotAllowedError"
            ? "カメラの使用を許可してください。"
            : "カメラを起動できませんでした。HTTPS設定とカメラの許可を確認してください。";
      } finally {
        cameraStarting = false;
        start.disabled = false;
      }
    });
    // 写真を撮影したらカメラを停止
    take.addEventListener("click", () => {
      if (!stream || !video.videoWidth || !video.videoHeight) {
        status.textContent = "カメラの準備ができていません。";
        return;
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      take.disabled = true;
      canvas.toBlob(blob => {
        take.disabled = false;
        if (!blob) {
          status.textContent = "写真を撮影できませんでした。";
          return;
        }
        photo = blob;
        clearPreview();
        previewUrl = URL.createObjectURL(blob);
        preview.src = previewUrl;
        preview.style.display = "block";
        cameraFrame.style.display = "none";
        take.hidden = true;
        retake.hidden = false;
        send.disabled = false;
        stopCamera();
        status.textContent = "";
      }, "image/jpeg", 0.9);
    });
    // 撮り直すときだけ、写真を解除してカメラを再起動
    retake.addEventListener("click", () => {
      if (cameraStarting) return;
      photo = null;
      send.disabled = true;
      retake.hidden = true;
      clearPreview();
      start.click();
    });
    // 送信
    send.addEventListener("click", async () => {
      handleNicknameInput();
      handleQuestionInput();
      if (!photo) {
        status.textContent = "先に手の写真を撮影してください。";
        return;
      }
      send.disabled = true;
      status.textContent = "";
      const form = new FormData();
      form.append("photo", photo, "palm.jpg");
      form.append("nickname", nickname.value);
      form.append("question", question.value);
      try {
        const response = await fetch("/api/send", {
          method: "POST",
          body: form
        });
        let result = {};
        try {
          result = await response.json();
        } catch (error) {
          result = {};
        }
        if (!response.ok) {
          throw new Error(result.error || "送信に失敗しました。");
        }
        status.textContent = "送信しました。";
      } catch (error) {
        status.textContent =
          "送信できませんでした。Telegram送信用のサーバー設定を確認してください。";
        send.disabled = false;
      }
    });
    handleNicknameInput();
    handleQuestionInput();
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
