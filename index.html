
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>手相占い</title>

<style>
:root {
  color-scheme: dark;
  --gold: #d6b66c;
  --bg: #0b0b0b;
  --panel: #151515;
  --text: #f5f0e5;
  --muted: #aaa397;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px 40px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", "Noto Sans JP", sans-serif;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

header {
  text-align: center;
  padding: 24px 0;
}

.symbol {
  color: var(--gold);
  font-size: 32px;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: .12em;
}

.panel {
  background: var(--panel);
  border: 1px solid #353027;
  border-radius: 18px;
  padding: 18px;
  margin-top: 18px;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 14px;
  color: var(--gold);
}

#cameraFrame,
#preview {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  background: #050505;
  overflow: hidden;
  margin: 12px 0 0;
}

#cameraFrame { display: none; }

#video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#preview {
  display: none;
  object-fit: contain;
}

#canvas { display: none; }

button {
  display: block;
  width: 100%;
  min-height: 50px;
  margin-top: 12px;
  padding: 14px 10px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.primary {
  color: #17130a;
  background: var(--gold);
}

.secondary {
  color: var(--gold);
  background: transparent;
}

button[hidden] { display: none !important; }

.field { margin-top: 18px; }

label {
  display: block;
  font-size: 14px;
  margin-bottom: 8px;
}

input,
textarea {
  width: 100%;
  border: 1px solid #474138;
  border-radius: 10px;
  padding: 12px;
  background: #0c0c0c;
  color: var(--text);
  font: inherit;
  font-size: 16px;
  outline: none;
}

input:focus,
textarea:focus { border-color: var(--gold); }

textarea {
  min-height: 110px;
  resize: vertical;
}

.counter {
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

#status {
  display: none;
  color: var(--gold);
  font-size: 14px;
  margin: 12px 0 0;
}

#status.visible { display: block; }

footer {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin-top: 28px;
}
</style>
</head>

<body>
<main class="container">

  <header>
    <div class="symbol">✧</div>
    <h1>手相占い</h1>
  </header>

  <section class="panel">
    <h2 class="section-title">01　手のひらを撮影</h2>

    <button id="start" class="primary" type="button">
      カメラを起動
    </button>

    <div id="cameraFrame">
      <video id="video" autoplay muted playsinline></video>
    </div>

    <img id="preview" alt="撮影した手のひら">
    <canvas id="canvas"></canvas>

    <button id="take" class="primary" type="button" hidden disabled>
      写真を撮る
    </button>

    <button id="retake" class="secondary" type="button" hidden>
      撮り直す
    </button>

    <p id="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2 class="section-title">02　相談内容</h2>

    <div class="field">
      <label for="nickname">ニックネーム（10字以内）</label>
      <input
        id="nickname"
        type="text"
        maxlength="10"
        placeholder="ニックネーム"
        autocomplete="nickname"
      >
      <div id="nicknameCount" class="counter">0 / 10</div>
    </div>

    <div class="field">
      <label for="question">相談内容（100字以内）</label>
      <textarea
        id="question"
        maxlength="100"
        placeholder="相談内容を入力"
      ></textarea>
      <div id="questionCount" class="counter">0 / 100</div>
    </div>

    <button id="send" class="primary" type="button" disabled>
      手相占いをする
    </button>
  </section>

  <footer>© 手相占い</footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const video = $("video");
  const canvas = $("canvas");
  const preview = $("preview");
  const cameraFrame = $("cameraFrame");
  const start = $("start");
  const take = $("take");
  const retake = $("retake");
  const send = $("send");
  const status = $("status");
  const nickname = $("nickname");
  const question = $("question");
  const nicknameCount = $("nicknameCount");
  const questionCount = $("questionCount");

  let stream = null;
  let photo = null;
  let previewUrl = null;
  let cameraStarting = false;
  let takingPhoto = false;
  let sending = false;
  let generation = 0;

  function showCameraPermissionMessage() {
    status.textContent = "カメラの使用を許可してください";
    status.classList.add("visible");
  }

  function hideStatus() {
    status.textContent = "";
    status.classList.remove("visible");
  }

  function updateCount(input, counter, max) {
    const chars = Array.from(input.value);
    if (chars.length > max) {
      input.value = chars.slice(0, max).join("");
    }
    counter.textContent = `${Array.from(input.value).length} / ${max}`;
  }

  nickname.addEventListener("input", () =>
    updateCount(nickname, nicknameCount, 10)
  );

  question.addEventListener("input", () =>
    updateCount(question, questionCount, 100)
  );

  function clearPreview() {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }
    preview.removeAttribute("src");
    preview.style.display = "none";
  }

  function stopCamera() {
    generation++;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.pause();
    video.srcObject = null;
    take.disabled = true;
  }

  function waitForVideoFrame() {
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      return Promise.resolve();
    }

    return new Promise((resolve, reject) => {
      let done = false;
      let timer;

      const cleanup = () => {
        clearTimeout(timer);
        video.removeEventListener("loadeddata", check);
        video.removeEventListener("playing", check);
      };

      const check = () => {
        if (video.videoWidth > 0 && video.videoHeight > 0 && !done) {
          done = true;
          cleanup();
          resolve();
        }
      };

      timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("video-timeout"));
      }, 7000);

      video.addEventListener("loadeddata", check);
      video.addEventListener("playing", check);
      check();
    });
  }

  async function startCamera() {
    if (stream || cameraStarting || takingPhoto || sending || photo) {
      return;
    }

    hideStatus();

    if (!navigator.mediaDevices?.getUserMedia) {
      showCameraPermissionMessage();
      return;
    }

    cameraStarting = true;
    start.disabled = true;
    take.disabled = true;

    const myGeneration = ++generation;
    let newStream = null;

    try {
      newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });

      if (myGeneration !== generation) {
        newStream.getTracks().forEach(track => track.stop());
        return;
      }

      stream = newStream;
      video.srcObject = newStream;
      cameraFrame.style.display = "block";
      preview.style.display = "none";

      await video.play();
      await waitForVideoFrame();

      if (myGeneration !== generation || stream !== newStream) return;

      take.hidden = false;
      take.disabled = false;
    } catch (error) {
      if (newStream) {
        newStream.getTracks().forEach(track => track.stop());
      }

      if (myGeneration === generation) {
        stream = null;
        video.pause();
        video.srcObject = null;
        cameraFrame.style.display = "none";
        showCameraPermissionMessage();
      }
    } finally {
      cameraStarting = false;
      start.disabled = false;
    }
  }

  start.addEventListener("click", startCamera);

  take.addEventListener("click", async () => {
    if (
      takingPhoto || cameraStarting || !stream ||
      !stream.active || !video.videoWidth || !video.videoHeight
    ) return;

    takingPhoto = true;
    take.disabled = true;

    try {
      const width = video.videoWidth;
      const height = video.videoHeight;

      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("canvas");

      context.drawImage(video, 0, 0, width, height);

      const blob = await new Promise((resolve, reject) => {
        canvas.toBlob(
          result => result
            ? resolve(result)
            : reject(new Error("photo-encode")),
          "image/jpeg",
          0.95
        );
      });

      if (!stream || !stream.active) {
        throw new Error("camera-changed");
      }

      photo = blob;
      clearPreview();

      previewUrl = URL.createObjectURL(blob);
      preview.src = previewUrl;
      preview.style.display = "block";
      cameraFrame.style.display = "none";

      take.hidden = true;
      retake.hidden = false;
      send.disabled = false;

      hideStatus();
    } catch (error) {
      take.disabled = false;
    } finally {
      takingPhoto = false;
    }
  });

  retake.addEventListener("click", async () => {
    if (cameraStarting || takingPhoto || sending) return;

    photo = null;
    clearPreview();
    hideStatus();

    preview.style.display = "none";
    cameraFrame.style.display = "block";
    retake.hidden = true;
    take.hidden = false;
    take.disabled = true;
    send.disabled = true;

    if (
      stream &&
      stream.active &&
      video.srcObject === stream &&
      video.videoWidth > 0
    ) {
      take.disabled = false;
      return;
    }

    await startCamera();
  });

  send.addEventListener("click", async () => {
    if (sending || takingPhoto || !photo) return;

    updateCount(nickname, nicknameCount, 10);
    updateCount(question, questionCount, 100);

    sending = true;
    send.disabled = true;
    retake.disabled = true;

    const form = new FormData();
    form.append("photo", photo, "palm.jpg");
    form.append("nickname", nickname.value);
    form.append("question", question.value);

    try {
      const response = await fetch("/api/send", {
        method: "POST",
        body: form
      });

      let result = {};
      try {
        result = await response.json();
      } catch (_) {}

      if (!response.ok || result.ok === false) {
        throw new Error("send-failed");
      }
    } catch (error) {
      send.disabled = false;
    } finally {
      sending = false;
      retake.disabled = false;
    }
  });

  updateCount(nickname, nicknameCount, 10);
  updateCount(question, questionCount, 100);

  window.addEventListener("pagehide", () => {
    stopCamera();
    clearPreview();
  });
})();
</script>
</body>
</html>
