<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>PALM GOLD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 20px 40px;
      background: #0b0b0b;
      color: #f5e8c8;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    .logo {
      color: #d8b56a;
      letter-spacing: 5px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 25px;
    }
    h1 {
      margin-top: 55px;
      font-family: Georgia, serif;
      font-size: clamp(35px, 8vw, 52px);
      color: #e2c27b;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 15px;
      border: 1px solid #d8b56a;
      border-radius: 10px;
      background: linear-gradient(135deg, #f0d99a, #bd9143);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .card {
      margin-top: 35px;
      padding: 22px;
      border: 1px solid #594725;
      border-radius: 18px;
      background: #151515;
    }
    .camera-frame {
      display: none;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }
    #video {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      background: #000;
      transform-origin: center center;
    }
    #preview {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
    }
    .zoom-controls {
      display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }
    .zoom-controls button {
      margin-top: 0;
      padding: 12px 8px;
      font-size: 15px;
    }
    .zoom-label {
      color: #d8b56a;
      font-size: 13px;
      white-space: nowrap;
    }
    input, textarea {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      background: #090909;
      border: 1px solid #594725;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }
    textarea {
      resize: none;
      overflow-y: auto;
    }
    label {
      display: block;
      text-align: left;
      margin-top: 20px;
      color: #d8b56a;
      font-size: 13px;
    }
    .character-count {
      margin-top: 6px;
      color: #a99a7d;
      font-size: 12px;
      text-align: right;
    }
    #status {
      margin-top: 15px;
      color: #d8b56a;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    footer {
      margin-top: 45px;
      padding: 15px 0 10px;
      color: #756b58;
      font-size: 11px;
      line-height: 1.8;
      clear: both;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">PALM GOLD</div>
    <h1>Your Hands.<br>Your Story.</h1>
    <section class="card">
      <h2>手相占いする</h2>
      <button id="start" type="button">📸 写真を撮る</button>
      <div class="camera-frame" id="cameraFrame">
        <video id="video" autoplay playsinline></video>
      </div>
      <div class="zoom-controls" id="zoomControls">
        <button id="zoomOut" type="button">− 縮小</button>
        <span class="zoom-label" id="zoomLabel">1x</span>
        <button id="zoomIn" type="button">＋ 拡大</button>
      </div>
      <canvas id="canvas" hidden></canvas>
      <img id="preview" alt="撮影した手の写真">
      <button id="take" type="button" hidden>写真を撮る</button>
      <button id="retake" type="button" hidden>撮り直す</button>
      <label for="nickname">ニックネーム（10字以内）</label>
      <input
        id="nickname"
        type="text"
        maxlength="10"
        autocomplete="off"
        placeholder="ニックネームを入力"
      >
      <div class="character-count" id="nicknameCount">0 / 10</div>
      <label for="question">相談内容（100字以内）</label>
      <textarea
        id="question"
        rows="3"
        maxlength="100"
        placeholder="相談内容を入力"
      ></textarea>
      <div class="character-count" id="questionCount">0 / 100</div>
      <button id="send" type="button" disabled>Telegramに送信する →</button>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
    <footer>PALM GOLD · YOUR STORY</footer>
  </main>
  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("preview");
    const cameraFrame = document.getElementById("cameraFrame");
    const zoomControls = document.getElementById("zoomControls");
    const zoomLabel = document.getElementById("zoomLabel");
    const start = document.getElementById("start");
    const take = document.getElementById("take");
    const retake = document.getElementById("retake");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const nickname = document.getElementById("nickname");
    const question = document.getElementById("question");
    const nicknameCount = document.getElementById("nicknameCount");
    const questionCount = document.getElementById("questionCount");
    const zoomIn = document.getElementById("zoomIn");
    const zoomOut = document.getElementById("zoomOut");
    const NICKNAME_LIMIT = 10;
    const QUESTION_LIMIT = 100;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 3;
    const ZOOM_STEP = 0.25;
    let stream = null;
    let photo = null;
    let previewUrl = null;
    let zoomLevel = 1;
    let cameraStarting = false;
    // 文字数制限とカウンター更新
    function limitCharacters(input, maxLength, counter) {
      const chars = Array.from(input.value);
      if (chars.length > maxLength) {
        const cursor = input.selectionStart;
        const limitedValue = chars.slice(0, maxLength).join("");
        input.value = limitedValue;
        if (cursor !== null) {
          const newCursor = Math.min(cursor, limitedValue.length);
          input.setSelectionRange(newCursor, newCursor);
        }
      }
      counter.textContent =
        `${Array.from(input.value).length} / ${maxLength}`;
    }
    function handleNicknameInput() {
      limitCharacters(nickname, NICKNAME_LIMIT, nicknameCount);
    }
    function handleQuestionInput() {
      limitCharacters(question, QUESTION_LIMIT, questionCount);
    }
    // 入力・貼り付け・日本語変換後も上限を適用
    nickname.addEventListener("input", handleNicknameInput);
    question.addEventListener("input", handleQuestionInput);
    nickname.addEventListener("compositionend", handleNicknameInput);
    question.addEventListener("compositionend", handleQuestionInput);
    nickname.addEventListener("paste", () => {
      requestAnimationFrame(handleNicknameInput);
    });
    question.addEventListener("paste", () => {
      requestAnimationFrame(handleQuestionInput);
    });
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
    }
    function clearPreview() {
      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
      }
      preview.removeAttribute("src");
      preview.style.display = "none";
    }
    function updateZoom() {
      video.style.transform = `scale(${zoomLevel})`;
      zoomLabel.textContent = `${Number(zoomLevel.toFixed(2))}x`;
      zoomOut.disabled = zoomLevel <= MIN_ZOOM;
      zoomIn.disabled = zoomLevel >= MAX_ZOOM;
    }
    function changeZoom(amount) {
      zoomLevel = Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          Math.round((zoomLevel + amount) * 100) / 100
        )
      );
      updateZoom();
    }
    zoomIn.addEventListener("click", () => changeZoom(ZOOM_STEP));
    zoomOut.addEventListener("click", () => changeZoom(-ZOOM_STEP));
    // 1回目でカメラ起動、起動中にもう1回押すと終了
    start.addEventListener("click", async () => {
      if (cameraStarting) return;
      status.textContent = "";
      if (stream) {
        stopCamera();
        cameraFrame.style.display = "none";
        zoomControls.style.display = "none";
        take.hidden = true;
        start.textContent = "📸 写真を撮る";
        return;
      }
      clearPreview();
      photo = null;
      zoomLevel = 1;
      updateZoom();
      send.disabled = true;
      take.hidden = true;
      retake.hidden = true;
      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        status.textContent =
          "カメラを利用できません。HTTPSのサイトで開いてください。";
        return;
      }
      cameraStarting = true;
      start.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        cameraFrame.style.display = "block";
        zoomControls.style.display = "grid";
        await video.play();
        take.hidden = false;
        start.textContent = "📸 カメラを閉じる";
      } catch (error) {
        stopCamera();
        cameraFrame.style.display = "none";
        zoomControls.style.display = "none";
        take.hidden = true;
        start.textContent = "📸 写真を撮る";
        if (error.name === "NotAllowedError") {
          status.textContent = "カメラの使用を許可してください。";
        } else if (error.name === "NotFoundError") {
          status.textContent = "利用できるカメラが見つかりません。";
        } else {
          status.textContent =
            "カメラを起動できませんでした。HTTPS設定とカメラの許可を確認してください。";
        }
      } finally {
        cameraStarting = false;
        start.disabled = false;
      }
    });
    // 写真撮影
    take.addEventListener("click", () => {
      if (!video.videoWidth || !video.videoHeight) {
        status.textContent = "カメラの準備ができていません。";
        return;
      }
      const sourceWidth = video.videoWidth / zoomLevel;
      const sourceHeight = video.videoHeight / zoomLevel;
      const sourceX = (video.videoWidth - sourceWidth) / 2;
      const sourceY = (video.videoHeight - sourceHeight) / 2;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext("2d");
      context.drawImage(
        video,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        0,
        0,
        canvas.width,
        canvas.height
      );
      canvas.toBlob(blob => {
        if (!blob) {
          status.textContent = "写真を撮影できませんでした。";
          return;
        }
        photo = blob;
        clearPreview();
        previewUrl = URL.createObjectURL(blob);
        preview.src = previewUrl;
        preview.style.display = "block";
        cameraFrame.style.display = "none";
        zoomControls.style.display = "none";
        take.hidden = true;
        retake.hidden = false;
        send.disabled = false;
        stopCamera();
        start.textContent = "📸 写真を撮る";
        status.textContent = "";
      }, "image/jpeg", 0.9);
    });
    // 撮り直し
    retake.addEventListener("click", () => {
      photo = null;
      send.disabled = true;
      retake.hidden = true;
      clearPreview();
      start.click();
    });
    // Telegram送信
    send.addEventListener("click", async () => {
      handleNicknameInput();
      handleQuestionInput();
      if (!photo) {
        status.textContent = "先に手の写真を撮影してください。";
        return;
      }
      send.disabled = true;
      status.textContent = "";
      const form = new FormData();
      form.append("photo", photo, "palm.jpg");
      form.append("nickname", nickname.value);
      form.append("question", question.value);
      try {
        const response = await fetch("/api/send", {
          method: "POST",
          body: form
        });
        let result = {};
        try {
          result = await response.json();
        } catch (error) {
          result = {};
        }
        if (!response.ok) {
          throw new Error(result.error || "送信に失敗しました。");
        }
        status.textContent = "送信しました。";
      } catch (error) {
        status.textContent =
          "送信できませんでした。Telegram送信用のサーバー設定を確認してください。";
        send.disabled = false;
      }
    });
    handleNicknameInput();
    handleQuestionInput();
    updateZoom();
    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
